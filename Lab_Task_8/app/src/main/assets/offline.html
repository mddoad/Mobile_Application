<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f5f5f5; }
        .card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; }
        .hint { color: #555; }
        .btn { display:inline-block; margin-top:12px; padding:10px 14px; background:#1565C0; color:white; border-radius:10px; text-decoration:none; }
    </style>
</head>
<body>
<div class="card">
    <h1>No Internet Connection</h1>
    <p class="hint">Please connect to Wi‑Fi or mobile data and try again.</p>
    <p class="hint">You can still use the shortcut buttons once you are online.</p>
</div>
</body>
</html>
